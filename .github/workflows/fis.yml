name: Wyniki FIS + strona

on:
  schedule:
    # zapas – GitHub często pomija zaplanowane uruchomienia; główny wyzwalacz to cron-job.org
    # (co 15 min wywołuje workflow_dispatch przez API GitHuba, instrukcja w README)
    - cron: "15 */2 * * 1-4"
    - cron: "*/30 8-22 * * 5,6,0"
  workflow_dispatch:
    inputs:
      athletes:
        description: "Odśwież też listę zawodników (tylko przed draftem!)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install pypdf

      - name: Pobierz dane z FIS
        if: github.event_name != 'push'
        run: |
          if [ "${{ inputs.athletes }}" = "true" ] || [ ! -f data/athletes.json ]; then
            python scraper/fis.py
          else
            python scraper/fis.py --skip-athletes
          fi
          python scraper/hills.py || echo "zdjęcia skoczni pominięte"
          # profile zawodników: każdy odświeżany raz w tygodniu, najwyżej 15 na uruchomienie
          python scraper/profiles.py --max 15 || echo "profile pominięte"

      - name: Zapisz zmiany w repozytorium
        id: save
        if: github.event_name != 'push'
        run: |
          git config user.name "fis-bot"
          git config user.email "fis-bot@users.noreply.github.com"
          git add -A data
          # sama zmiana znacznika „updated” to nie nowe dane – bez commita i bez wdrożenia strony
          if git diff --cached --quiet -I '"updated":'; then
            echo "Brak nowych danych"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Wyniki FIS $(date -u +%Y-%m-%dT%H:%MZ)" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # „?v=dev” w adresach skryptów i stylów -> skrót commita, żeby przeglądarki nie trzymały starego kodu
      - name: Wersja plików strony
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html js/*.js

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        id: deploy
